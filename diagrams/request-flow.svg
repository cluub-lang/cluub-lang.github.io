<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title>What happens when a user clicks a button in a Cluub app</title>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <g fill="#fff" text-anchor="middle">
    <rect x="10" y="20" width="160" height="50" rx="10" fill="#6366f1"/><text x="90" y="42">1. User clicks</text><text x="90" y="59" font-size="11">button "Add", on click add</text>
    <rect x="200" y="20" width="160" height="50" rx="10" fill="#6366f1"/><text x="280" y="42">2. Page action runs</text><text x="280" y="59" font-size="11">TodoApi.add(title: draft)</text>
    <rect x="390" y="20" width="160" height="50" rx="10" fill="#0ea5e9"/><text x="470" y="42">3. Server checks input</text><text x="470" y="59" font-size="11">types · missing values → 400</text>
    <rect x="580" y="20" width="170" height="50" rx="10" fill="#0284c7"/><text x="665" y="42">4. Service rules</text><text x="665" y="59" font-size="11">require … / fail …</text>
    <rect x="580" y="130" width="170" height="50" rx="10" fill="#10b981"/><text x="665" y="152">5. Store saves</text><text x="665" y="169" font-size="11">model validated again</text>
    <rect x="390" y="130" width="160" height="50" rx="10" fill="#0ea5e9"/><text x="470" y="152">6. JSON response</text><text x="470" y="169" font-size="11">200 + data</text>
    <rect x="200" y="130" width="160" height="50" rx="10" fill="#6366f1"/><text x="280" y="152">7. State updated</text><text x="280" y="169" font-size="11">todos = TodoApi.list()</text>
    <rect x="10" y="130" width="160" height="50" rx="10" fill="#6366f1"/><text x="90" y="152">8. View re-renders</text><text x="90" y="169" font-size="11">only changed DOM is patched</text>
    <rect x="200" y="250" width="350" height="54" rx="10" fill="#ef4444"/><text x="375" y="272">Any failure in steps 3–5 (400 / 404 / 502 / 500)</text><text x="375" y="290" font-size="11">→ the page shows the message as a toast. No error code needed.</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <path d="M170 45H196" marker-end="url(#b)"/><path d="M360 45H386" marker-end="url(#b)"/><path d="M550 45H576" marker-end="url(#b)"/>
    <path d="M665 70V126" marker-end="url(#b)"/><path d="M580 155H554" marker-end="url(#b)"/><path d="M390 155H364" marker-end="url(#b)"/><path d="M200 155H174" marker-end="url(#b)"/>
    <path d="M470 70V246" stroke="#ef4444" stroke-dasharray="5 4" marker-end="url(#b)"/>
  </g>
</svg>
