<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <title>Cluub layers: page uses api, api uses service, service uses store, client and AI</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect x="10" y="20" width="200" height="260" rx="14" fill="#0072B2" fill-opacity=".08" stroke="#0072B2" stroke-opacity=".5"/>
  <text x="110" y="45" text-anchor="middle" fill="#0072B2" font-weight="700">UI layer (browser)</text>
  <rect x="40" y="70" width="140" height="56" rx="10" fill="#0072B2"/><text x="110" y="96" text-anchor="middle" fill="#FFFFFF" font-weight="700">page</text><text x="110" y="114" text-anchor="middle" fill="#FFFFFF" font-size="11">state · actions · view</text>
  <rect x="40" y="150" width="140" height="44" rx="10" fill="#56B4E9"/><text x="110" y="177" text-anchor="middle" fill="#1E293B">component</text>
  <rect x="40" y="212" width="140" height="44" rx="10" fill="#56B4E9"/><text x="110" y="239" text-anchor="middle" fill="#1E293B">layout</text>
  <rect x="250" y="20" width="500" height="260" rx="14" fill="#009E73" fill-opacity=".08" stroke="#009E73" stroke-opacity=".5"/>
  <text x="500" y="45" text-anchor="middle" fill="#1E293B" font-weight="700">Backend (Node server)</text>
  <rect x="270" y="70" width="120" height="56" rx="10" fill="#009E73"/><text x="330" y="96" text-anchor="middle" fill="#1E293B" font-weight="700">api</text><text x="330" y="114" text-anchor="middle" fill="#1E293B" font-size="11">validated routes</text>
  <rect x="430" y="70" width="130" height="56" rx="10" fill="#0072B2"/><text x="495" y="96" text-anchor="middle" fill="#FFFFFF" font-weight="700">service</text><text x="495" y="114" text-anchor="middle" fill="#FFFFFF" font-size="11">business rules</text>
  <rect x="600" y="62" width="130" height="44" rx="10" fill="#009E73"/><text x="665" y="82" text-anchor="middle" fill="#1E293B" font-weight="700">store</text><text x="665" y="98" text-anchor="middle" fill="#1E293B" font-size="11">data layer</text>
  <rect x="600" y="122" width="130" height="44" rx="10" fill="#E69F00"/><text x="665" y="142" text-anchor="middle" fill="#1E293B" font-weight="700">client</text><text x="665" y="158" text-anchor="middle" fill="#1E293B" font-size="11">network layer</text>
  <rect x="600" y="182" width="130" height="44" rx="10" fill="#CC79A7"/><text x="665" y="202" text-anchor="middle" fill="#1E293B" font-weight="700">ask ai</text><text x="665" y="218" text-anchor="middle" fill="#1E293B" font-size="11">Claude · OpenAI · …</text>
  <path d="M180 98H266" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/><text x="223" y="90" text-anchor="middle" fill="#64748B" font-size="11">HTTP</text>
  <path d="M390 98H426" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M560 92L596 84" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M560 104L596 140" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M545 126L600 198" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M110 126V146" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="500" y="262" text-anchor="middle" fill="#64748B" font-size="12">Arrows are the only allowed "uses" directions. Anything else is error E201.</text>
</svg>
